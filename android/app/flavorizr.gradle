android {
    flavorDimensions += "flavor-type"

    productFlavors {
        development {
            dimension "flavor-type"
            applicationId "com.kena.mlb.dev"
            resValue "string", "app_name", "[DEV] kena"
        }
        staging {
            dimension "flavor-type"
            applicationId "com.kena.mlb.stg"
            resValue "string", "app_name", "[STG] kena"
        }
        production {
            dimension "flavor-type"
            applicationId "com.kena.mlb"
            resValue "string", "app_name", "kena"
        }
    }
}